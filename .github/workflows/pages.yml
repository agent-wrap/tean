name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.5.4"
      # $$ math is rendered at build time. The 0.10.0 release ships no
      # binaries, so build it once and cache it; the version matches the
      # one devbox.json resolves locally.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          cache-all-crates: true
      - name: install mdbook-katex
        run: |
          cargo install --locked mdbook-katex@0.10.0
          mdbook-katex --version
      - run: mdbook build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
